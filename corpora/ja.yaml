# Japanese corpus manifest. Corpus text is never committed.
language:
  code: ja
  tokenizer: sudachi-ja
  lemma_package: honeyeater_lemma_ja
  lemma_pattern: '^[㐀-䶿一-鿿぀-ゟ゠-ヿー々〆ヶ]+$'
  fold_case: false
  lowercase_forms: false
  readings: true
  host_tokens: skip  # an ending is part of its host word: count the word once (2026-10-24)
  top_n: 50000
  forms_kept: 5
hygiene: {min_chars: 6, max_chars: 400, min_alpha_ratio: 0.6, gap_filter: true, langid_min_prob: 0.5}
parts: 100
checks:
  review_top_n: 10000
  form_ratio_threshold: 1000.0
  plural_suffixes: []
  short_lemma_max_len: 1
sources:
  - name: hplt-v2-ja
    kind: hplt
    licence: CC0-1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    notes: >-
      HPLT v2.0 cleaned shards (CC0 dedication over CommonCrawl / Internet Archive
      web text). Each file is ~50-70 GB compressed, so it is streamed and never
      stored; a run reads the first max_chars_per_url characters of each URL.
      The full map is https://data.hplt-project.org/two/cleaned/jpn_Jpan_map.txt;
      append URLs here to count more. Documents arrive grouped by crawl file, so
      read several URLs rather than one deeply.
    segment_lang: jpn_Jpan
    urls:
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/10.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/11.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/12.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/13.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/14.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/15.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/16.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/17.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/18.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/19.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/20.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/21.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/1.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/2.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/3.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/4.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/5.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/6.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/7.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/8.jsonl.zst
      - https://data.hplt-project.org/two/cleaned/jpn_Jpan/9.jsonl.zst
    shard_chars: 20000000
    # Every URL in the map (21) x 92M raw characters at ~2.72 per counted token ~ 710M tokens:
    # sized so the split-half stopping rule can fire before the data runs out (2026-11-01: the
    # rule needed roughly 500M+ by extrapolation from the first 50M). Counted in parts across
    # machines (count --part i/N; README §Distributed counting).
    max_chars_per_url: 92000000
  - name: tatoeba-jpn
    first: true  # counted before the web: every checkpoint holds it whole
    kind: tsv
    licence: CC-BY-2.0-FR
    licence_url: https://tatoeba.org/en/terms_of_use
    notes: >-
      Tatoeba jpn export (CC BY 2.0 FR; a subset is CC0). Attribution to
      Tatoeba contributors is the only obligation and is recorded in
      reference/licenses/ja.md. Conversational top-up; the export is
      re-generated weekly, so the sha256 is recorded per run, not pinned.
    urls:
      - https://downloads.tatoeba.org/exports/per_language/jpn/jpn_sentences.tsv.bz2
    column: 2
    pseudo_doc_lines: 50
    shard_chars: 20000000
    hygiene: {min_chars: 2, max_chars: 150, min_alpha_ratio: 0.5, gap_filter: true, langid_min_prob: 0.0}
# `frequer forms`: tokenizer-only inventory (see frequer/forms_run.py). Tokens come from the
# sudachi-ja backend's segment + tokenize, as the app produces them. Web text gets 90% of the
# token budget over every HPLT shard in the map; Tatoeba the rest, whole.
forms:
  script: jpan
  tokenizer: backend
  sources:
    hplt-v2-ja: {share: 0.9, raw_chars_per_token: 2.5}
    tatoeba-jpn: {share: 0.1, raw_chars_per_token: 5.0}
pilot:
  shard_chars: 1200000
  urls: {hplt-v2-ja: 2}
  max_chars_per_url:
    hplt-v2-ja: 2000000
    tatoeba-jpn: 500000
