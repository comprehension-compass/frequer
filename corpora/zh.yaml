    # The 2026-11-06 pilot: ~4.7 raw characters per counted token (raw counts the lines hygiene drops) and
    # ~2,700 tokens a second per worker. 79 URLs x 32M raw characters ~ 2.5B characters ~ 540M tokens, counted in
    # parts across machines (count --part i/N); the split-half rule may stop it earlier.
    shard_chars: 16000000
    max_chars_per_url: 32000000
  - name: tatoeba-cmn
    first: true  # counted before the web: every checkpoint holds it whole
    kind: tsv
    licence: CC-BY-2.0-FR
    licence_url: https://tatoeba.org/en/terms_of_use
    notes: >-
      Tatoeba cmn export (CC BY 2.0 FR; a subset is CC0). Attribution to Tatoeba contributors is the only
      obligation. It mixes Simplified and Traditional sentences; the Simplified filter keeps the Simplified
      ones. Re-generated weekly, so the sha256 is recorded per run, not pinned.
    urls:
      - https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences.tsv.bz2
    column: 2
    pseudo_doc_lines: 50
    shard_chars: 2000000
    hygiene: {min_chars: 2, max_chars: 150, min_alpha_ratio: 0.5, gap_filter: true, langid_min_prob: 0.0,
              simplified_only: true, traditional_doc_share: 1.0}
forms:
  script: hans
  tokenizer: backend
  sources:
    hplt-v2-zh: {share: 0.9, raw_chars_per_token: 1.6}
    tatoeba-cmn: {share: 0.1, raw_chars_per_token: 1.6}
pilot:
  shard_chars: 1500000
  urls: {hplt-v2-zh: 2}
  max_chars_per_url:
    hplt-v2-zh: 3000000
    tatoeba-cmn: 1000000
