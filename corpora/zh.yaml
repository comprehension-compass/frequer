# Mandarin Chinese (Simplified) corpus manifest. Corpus text is never committed.
language:
  code: zh
  tokenizer: jieba-zh
  lemma_package: honeyeater_lemma_zh
  # Honeyeater lexicon.language_seed._HANS_ZH_PATTERN (the loader's zh lemma_pattern): Han only, so
  # Latin-script tokens are never counted as words.
  lemma_pattern: "^[\U00002E80-\U00002EF3\U00002F00-\U00002FD5\U00003005-\U00003007\U00003400-\U00004DBF\U00004E00-\U00009FFF\U0000F900-\U0000FAFF\U00020000-\U000323AF]+$"
  fold_case: false
  lowercase_forms: false
  readings: false
  top_n: 40000  # 2026-11-07 (developer, via the coordinator): cutoff from full/zh/band-samples.md
  cutoff: '2026-11-07 developer: 40k (full/zh/band-samples.md, full/zh/band-report.md)'
  forms_kept: 5
  # Junk rules: ja's set for a script with neither case nor accents. No proper-noun dictionary: every
  # PROPN-majority lemma (the release's own name verdict) is reviewed (propn_evidence: tag), and names that are
  # learnable things stay (lemmatiser rulings v3.42 R12).
  junk:
    rules: [diversity, citation, shape, propn_band]
    diversity_max_clumping: 0.2  # ja's HPLT calibration; re-checked on the zh sample before review
    propn_evidence: tag
    short_max_length: 1  # a lone character with a low wordfreq zipf is suspect (bound morphemes, cut names)
    short_zipf_min: 3.5
    max_length: 8
    review_top: 40500
    review_multi_flag: true
    number_rule: true  # the app's number check (lexicon.number_words) decides 漢数字 it knows
    names_final: false  # Honeyeater has no reference/learnable-names/zh.json: reviewers decide names
# py3langid calls much ordinary Mandarin web text Wu (wuu): on a 1,500-document sample of HPLT file 10, 2,621 of
# 4,740 langid drops were wuu, nearly all Mandarin; yue (Cantonese) stays out.
hygiene: {min_chars: 4, max_chars: 400, min_alpha_ratio: 0.5, gap_filter: true, langid_min_prob: 0.5,
          langid_aliases: [wuu], simplified_only: true, traditional_doc_share: 0.2}
parts: 100
checks:
  review_top_n: 10000
  form_ratio_threshold: 1000.0
  plural_suffixes: []
  short_lemma_max_len: 1
sources:
  - name: hplt-v2-zh
    kind: hplt
    licence: CC0-1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    notes: >-
      HPLT v2.0 cleaned shards, zho_Hans (CC0 dedication over CommonCrawl / Internet Archive web text), as
      for es and de. Each file is ~7 GB compressed, streamed and never stored; a run reads the first
      max_chars_per_url characters of each of the 79 URLs in https://data.hplt-project.org/two/cleaned/zho_Hans_map.txt
      (documents arrive grouped by crawl file, so many shallow reads beat few deep ones). Simplified only:
      a line OpenCC t2s changes is dropped, and a document whose lines are 20 % or more Traditional is
      dropped whole (hygiene simplified_only; Honeyeater doc 06 §Simplified only).
    segment_lang: zho_Hans
    urls:
      - https://data.hplt-project.org/two/cleaned/zho_Hans/10.jsonl.zst
